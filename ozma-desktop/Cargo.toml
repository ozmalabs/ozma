[package]
name = "ozma-desktop"
version = "0.1.0"
edition = "2021"
description = "Windows notification-area shell for Ozma"
license = "AGPL-3.0-only"

[[bin]]
name = "ozma-desktop"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
