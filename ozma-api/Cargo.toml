[package]
name = "ozma-api"
version = "0.1.0"
edition = "2021"
description = "Axum HTTP/WS API for the Ozma node contract."
license = "AGPL-3.0-only"

[dependencies]
ozma-protocol = { path = "../ozma-protocol" }
ozma-session = { path = "../ozma-session" }
ozma-display = { path = "../ozma-display" }
ozma-media = { path = "../ozma-media" }
axum = { version = "0.7", features = ["json", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "macros"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["user"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["full"] }
