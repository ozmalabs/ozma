[package]
name = "ozma-transport"
version = "0.1.0"
edition = "2021"
description = "Channel model and transport adapters for Ozma sessions."
license = "AGPL-3.0-only"

[features]
default = ["quic"]
# Native QUIC/WebTransport adapter (quinn + rustls + rcgen). Disable this when
# a dependent crate must build without a QUIC stack.
quic = ["dep:quinn", "dep:rustls", "dep:rcgen"]

[dependencies]
ozma-protocol = { path = "../ozma-protocol" }
async-trait = "0.1"
bytes = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "io-util", "macros"] }
tracing = "0.1"

# QUIC is opt-in at crate-feature level and on by default. We deliberately use
# ring (not aws-lc) so the workspace needs no extra native build tooling.
quinn = { version = "0.11", optional = true, default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", optional = true, default-features = false, features = ["crypto", "ring", "pem"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[test]]
name = "quic_loopback"
required-features = ["quic"]

