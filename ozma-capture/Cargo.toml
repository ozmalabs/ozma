[package]
name = "ozma-capture"
version = "0.1.0"
edition = "2021"
description = "Capture-source providers for Ozma: fake, V4L2, PipeWire, X11 x11grab, XDG Portal ScreenCast, QMP screendump, Looking Glass KVMFR, and v4l2loopback virtual capture."
license = "AGPL-3.0-only"

[features]
default = ["portal"]
# D-Bus ScreenCast client. Linux-only and optional: a build without it still
# exposes the X11 provider and the PipeWire/V4L2 paths.
portal = ["dep:zbus"]

[dependencies]
ozma-protocol = { path = "../ozma-protocol" }
ozma-media = { path = "../ozma-media" }
ozma-qmp = { path = "../ozma-qmp" }
async-trait = "0.1"
thiserror = { workspace = true }
tokio = { version = "1", features = ["fs", "sync", "time", "rt", "process", "io-util", "net"] }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
nix = { version = "0.30", features = ["fs", "socket", "uio", "user"] }
memmap2 = "0.8"
ozma-pipewire = { path = "../ozma-pipewire" }
zbus = { version = "4.4", optional = true, default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
ozma-protocol = { path = "../ozma-protocol" }
serde_json = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
