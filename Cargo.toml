[workspace]
resolver = "2"
members = [
    "ozma-node",
    "ozma-softnode",
    "ozma-agent",
    "ozma-drivers",
    "ozma-proto",
    "ozma-protocol",
    "ozma-protocol-proto",
    "ozma-display-protocol",
    "ozma-display-definition",
    "ozma-aperture",
    "ozma-media",
    "ozma-capture",
    "ozma-encode",
    "ozma-session",
    "ozma-auth",
    "ozma-transport",
    "ozma-display",
    "ozma-input",
    "ozma-qmp",
    "ozma-power",
    "ozma-audio",
    "ozma-client",
    "ozma-client-core",
    "ozma-transport-web",
    "ozma-web",
    "ozma-decode",
    "ozma-playback",
    "ozma-rtsp",
    "ozma-rtp",
    "ozma-api",
    "ozma-mesh",
    "ozma-crypto",
    "ozma-hid",
    "ozma-clipboard",
    "ozma-pipewire",
    "ozma-usb",
]

[workspace.dependencies]
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow      = "1"
thiserror   = "1"
bytes       = "1"
clap        = { version = "4.0", features = ["derive", "env"] }
uuid        = { version = "1.0", features = ["v4"] }
axum        = { version = "0.7", features = ["json"] }
prometheus  = { version = "0.13", features = ["process"] }
alsa        = "0.9"
usb-gadget  = "0.5"
async-trait = "0.1"
libc        = "0.2"
prost       = "0.14"
prost-types = "0.14"
pbjson      = "0.9"
