[package]
name        = "ozma-node"
version     = "0.1.0"
edition     = "2021"
description = "Ozma hardware KVM node — mDNS, controller registration, session API, UAC2 bridge"

[[bin]]
name = "ozma-node"
path = "src/main.rs"

[features]
default = ["webtransport"]
# Enable to compile without a real ConfigFS/USB gadget subsystem (e.g. CI).
# When set, uac2_active() always returns false without touching the kernel.
stub-gadget = []
# Browser-facing WebTransport (HTTP/3) listener. On by default for the desktop
# node; disable for a build that must not carry the HTTP/3 stack.
webtransport = ["ozma-transport/webtransport"]

[dependencies]
# Workspace-shared
tokio              = { workspace = true }
tokio-util         = "0.7"
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
usb-gadget         = { workspace = true }
alsa               = { workspace = true }
libc               = { workspace = true }

# Ozma plan crates
ozma-protocol = { path = "../ozma-protocol" }
ozma-api      = { path = "../ozma-api" }
ozma-media    = { path = "../ozma-media" }
ozma-capture  = { path = "../ozma-capture" }
ozma-encode   = { path = "../ozma-encode" }
ozma-session  = { path = "../ozma-session" }
ozma-auth     = { path = "../ozma-auth" }
ozma-aperture = { path = "../ozma-aperture" }
ozma-transport = { path = "../ozma-transport" }
ozma-rtsp     = { path = "../ozma-rtsp" }
ozma-display  = { path = "../ozma-display" }
ozma-input    = { path = "../ozma-input" }
ozma-qmp      = { path = "../ozma-qmp" }
ozma-power    = { path = "../ozma-power" }
ozma-audio    = { path = "../ozma-audio" }
ozma-decode   = { path = "../ozma-decode" }
# USB gadget/ConfigFS/virtual-media controller (Phase 3 USB workstream).
ozma-usb      = { path = "../ozma-usb" }
# Thermal zones, fan curves, anti-cycling control, and noise estimation.
ozma-thermal  = { path = "../ozma-thermal" }
# Deep HWiNFO-class hardware inventory and sensors.
ozma-hardware = { path = "../ozma-hardware" }
# Binary display envelopes (scene snapshots) for the reliable Display channel.
ozma-display-protocol = { path = "../ozma-display-protocol" }
ozma-display-ir = { path = "../ozma-display-ir" }
# Browser camera/microphone reassembly is shared with the client side.
ozma-client-core = { path = "../ozma-client-core" }
# Opt-in userspace WireGuard mesh + mDNS peer identity (`--mesh`).
ozma-mesh     = { path = "../ozma-mesh" }
# Read-only persisted multiseat plan/status for `--multiseat`.
ozma-multiseat = { path = "../ozma-multiseat" }

# HTTP API
axum = { version = "0.7", features = ["json", "ws"] }
async-trait = { workspace = true }
# CORS for the local browser (wasm) dev origin.
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Native QUIC/control transport
bytes = { workspace = true }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP client (registration + heartbeat). rustls keeps the node portable and
# avoids a system OpenSSL/native-tls dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# mDNS advertisement
libmdns = "0.9"

# Networking helpers
local-ip-address = "0.6"
hostname         = "0.4"
# Per-client zlib stream for the RFB ZRLE encoding.
flate2           = "1"
# JFIF encoding for the RFB Tight JPEG sub-encoding (same crate ozma-encode
# already uses; no new crate is downloaded).
jpeg-encoder     = "0.6"
# AIDA64-compatible system metrics (CPU load, memory use, uptime, processes).
sysinfo          = "0.29"
# SSE stream construction for the AIDA64 RemoteSensor endpoint.
futures-util     = "0.3"
# Opt-in UART/USB-serial console (`--serial-device`). default-features are
# disabled to avoid a libudev build/runtime dependency; the node opens an
# explicit operator-supplied path and never enumerates devices.
serialport       = { version = "4.7", default-features = false }

# Opt-in I²C/SPI bus surface. These safe wrappers are Linux-only; the bus
# module's real backends are `#[cfg(target_os = "linux")]` and report a typed
# `bus.unsupported` elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
i2cdev = "0.6.2"
spidev = "0.7.1"
# Safe GPIO character-device wrapper (no unsafe in this crate). Lines are only
# opened after an exact --gpio-allow CHIP:LINE check.
gpio-cdev = "0.6.0"
# Safe SocketCAN sockets. Default features (netlink/dump) are unnecessary: the
# node only opens an explicit allowlisted interface and shells out to `ip
# -details -json` for status.
socketcan = { version = "4.0.0", default-features = false }

# Optional AIDA64 shared-memory/Registry bridge. The Win32 calls are only
# compiled on Windows; Linux/macOS builds use the portable protocol layer.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "basetsd",
    "errhandlingapi",
    "handleapi",
    "memoryapi",
    "minwindef",
    "minwinbase",
    "reason",
    "winnt",
    "winreg",
] }

[package.metadata.deb]
# Explicit runtime dependencies avoid dpkg-shlibdeps, which cannot resolve
# aarch64 libraries when packaging a cross-compiled binary on an amd64 host.
depends = "libc6, libgcc-s1, libstdc++6, libasound2, libpipewire-0.3-0, libpam0g, libudev1, libopus0"

[lib]
name = "ozma_node"
path = "src/lib.rs"

[dev-dependencies]
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jpeg-decoder = "0.3"
tempfile = "3"
ozma-client = { path = "../ozma-client" }
