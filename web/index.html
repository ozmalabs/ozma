<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ozma browser client</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101216;
      --panel: #181c22;
      --line: #2c333d;
      --text: #e6e9ee;
      --muted: #95a0ae;
      --accent: #59b6ff;
      --bad: #ff6b6b;
      --good: #5dd39e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin-bottom: .75rem; }
    h1 { font-size: 1.1rem; margin: 0 1rem 0 0; font-weight: 600; letter-spacing: .02em; }
    label { color: var(--muted); display: flex; gap: .4rem; align-items: center; }
    input {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: .35rem;
      padding: .35rem .5rem;
      min-width: 18rem;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: .35rem;
      padding: .4rem .8rem;
      cursor: pointer;
    }
    button.primary { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    #stage {
      position: relative;
      background: #000;
      border: 1px solid var(--line);
      border-radius: .4rem;
      overflow: hidden;
      max-width: 100%;
      width: fit-content;
      min-width: 320px;
      min-height: 180px;
    }
    #screen {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 11rem);
      outline: none;
      cursor: crosshair;
      touch-action: none;
      background: #000;
    }
    #stage:focus-within { border-color: var(--accent); }
    #overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      pointer-events: none;
      text-align: center;
      padding: 1rem;
    }
    #stage.connected #overlay { display: none; }
    #status {
      margin: .75rem 0 0;
      color: var(--muted);
      min-height: 1.4em;
      white-space: pre-wrap;
    }
    #status.error { color: var(--bad); }
    #status.good { color: var(--good); }
    pre#stats {
      margin: .6rem 0 0;
      padding: .6rem .75rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: .4rem;
      color: var(--muted);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ozma browser client</h1>
    <label>Node API <input id="node" value="http://127.0.0.1:7382" spellcheck="false"></label>
    <button id="connect" class="primary">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
  </header>

  <div id="stage">
    <canvas id="screen" width="1280" height="720" tabindex="0" aria-label="Remote desktop"></canvas>
    <div id="overlay">
      Connect to a node to start.<br>
      Build <code>web/pkg</code> with <code>./build.sh</code> first.<br>
      The first click is also the audio unlock gesture.
    </div>
  </div>

  <p id="status">idle</p>
  <pre id="stats">stats appear after connect</pre>

  <script type="module" src="./main.js"></script>
</body>
</html>
