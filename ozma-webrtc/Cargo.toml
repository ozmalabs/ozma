# This prototype intentionally lives in its own workspace: webrtc-dtls pins
# x25519-dalek ^2 while the main workspace's ozma-crypto pins the pre-release
# 2.0.0-rc.3, and Cargo cannot unify the two in one lockfile. Keeping a
# separate lock here means adding native WebRTC cannot destabilise `ozma-node`.
[workspace]

[package]
name = "ozma-webrtc"
version = "0.1.0"
edition = "2021"
description = "Native Rust WebRTC helper speaking the ozma-node GStreamer helper signaling protocol."
license = "AGPL-3.0-only WITH OzmaPluginException"

[[bin]]
name = "ozma-webrtc-native"
path = "src/main.rs"

[dependencies]
webrtc = "0.11"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
libc = "0.2"
openh264 = "0.9"
audiopus = "0.3.0-rc.0"
ozma-pipewire = { path = "../ozma-pipewire" }

[dev-dependencies]
tempfile = "3"
