[package]
name = "ozma-encode"
version = "0.1.0"
edition = "2021"
description = "Encoder selection, probing, and a real software H.264 backend for Ozma."
license = "AGPL-3.0-only"

[dependencies]
ozma-protocol = { path = "../ozma-protocol" }
ozma-media = { path = "../ozma-media" }
async-trait = "0.1"
bytes = "1"
jpeg-decoder = "0.3"
openh264 = "0.9"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tracing = "0.1"

[dev-dependencies]
jpeg-encoder = "0.6"
tokio = { version = "1", features = ["full"] }
