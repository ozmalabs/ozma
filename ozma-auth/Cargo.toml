[package]
name = "ozma-auth"
version = "0.1.0"
edition = "2021"
description = "Scoped session tokens, permission checks, and consent policy for Ozma."
license = "AGPL-3.0-only"

[dependencies]
ozma-protocol = { path = "../ozma-protocol" }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
