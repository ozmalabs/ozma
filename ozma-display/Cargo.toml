[package]
name = "ozma-display"
version = "0.1.0"
edition = "2021"
description = "Virtual-display providers, topology/input mapping, and EDID generation."
license = "AGPL-3.0-only"

[dependencies]
ozma-protocol = { path = "../ozma-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
