[Metadata]
Name=Fixture Skin
Author=Test
CustomMetadata=keep

[Variables]
Accent=#ff0000

[MeasureCPU]
Measure=CPU
MinValue=0
MaxValue=100
UnknownMeasureKey=keep
UnknownMeasureKey=keep-second

[MeasureRAM]
Measure=PhysicalMemory
MinValue=0
MaxValue=100

[MeasureTime]
Measure=Time
Format=%H:%M
UnknownMeasureKey=keep-time

[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\test.lua
Disabled=0

[MeterCPUString]
Meter=String
MeasureName=MeasureCPU
Text=CPU: %1%
X=10
Y=20
W=200
H=30
FontFace=Segoe UI
FontSize=12
FontColor=255,255,255,255
AntiAlias=1
UnknownMeterKey=retain

[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
MinValue=0
MaxValue=100
X=10
Y=60
W=200
H=20
BarColor=0,255,0,255
BarImage=images/bar.png

[MeterHistory]
Meter=Line
MeasureName=MeasureCPU
LineColor=255,0,0,255

[MeterHistogram]
Meter=Histogram
MeasureName=MeasureCPU

[MeterRing]
Meter=Roundline
MeasureName=MeasureCPU
MinValue=0
MaxValue=100

[MeterIcon]
Meter=Image
ImageName=icons/cpu.png
