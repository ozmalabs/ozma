[package]
name = "ozma-web"
version = "0.1.0"
edition = "2021"
description = "Rust/WebAssembly Ozma session client: WebTransport, WebCodecs, canvas, and Web Audio."
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ozma-protocol = { path = "../ozma-protocol" }
ozma-transport = { path = "../ozma-transport", default-features = false }
ozma-client-core = { path = "../ozma-client-core" }
ozma-transport-web = { path = "../ozma-transport-web" }
base64 = "0.22"
bytes = "1"
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferOptions",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioData",
    "AudioDataCopyToOptions",
    "AudioDataInit",
    "AudioDecoder",
    "AudioDecoderConfig",
    "AudioDecoderInit",
    "AudioDecoderSupport",
    "AudioDestinationNode",
    "AudioNode",
    "AudioSampleFormat",
    "BaseAudioContext",
    "CanvasRenderingContext2d",
    "CodecState",
    "console",
    "Document",
    "EncodedAudioChunk",
    "EncodedAudioChunkInit",
    "EncodedAudioChunkType",
    "EncodedVideoChunk",
    "EncodedVideoChunkInit",
    "EncodedVideoChunkType",
    "HardwareAcceleration",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlVideoElement",
    "Performance",
    "VideoDecoder",
    "VideoDecoderConfig",
    "VideoDecoderInit",
    "VideoDecoderSupport",
    "VideoFrame",
    "Window",
] }
