[package]
name = "ozma-client"
version = "0.1.0"
edition = "2021"
description = "Native Ozma client library and headless session probe."
license = "AGPL-3.0-only"

[[bin]]
name = "ozma-client"
path = "src/main.rs"

[[bin]]
name = "ozma-play"
path = "src/bin/ozma-play.rs"

[features]
default = []
window = ["ozma-playback/window"]

[dependencies]
ozma-protocol = { path = "../ozma-protocol" }
ozma-transport = { path = "../ozma-transport" }
ozma-decode = { path = "../ozma-decode" }
ozma-playback = { path = "../ozma-playback" }
png = "0.17"
anyhow = { workspace = true }
base64 = "0.22"
bytes = { workspace = true }
clap = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tracing-subscriber = { workspace = true }
urlencoding = "2"

[dev-dependencies]
axum = "0.7"
openh264 = "0.9"
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
