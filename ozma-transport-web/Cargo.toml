[package]
name = "ozma-transport-web"
version = "0.1.0"
edition = "2021"
description = "Browser WebTransport adapter for Ozma sessions (wasm32)."
license = "AGPL-3.0-only"

[dependencies]
ozma-protocol = { path = "../ozma-protocol" }
ozma-transport = { path = "../ozma-transport", default-features = false }
ozma-client-core = { path = "../ozma-client-core" }
async-trait = "0.1"
bytes = "1"
js-sys = "0.3"
thiserror = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "WebTransport",
    "WebTransportOptions",
    "WebTransportHash",
    "WebTransportBidirectionalStream",
    "WebTransportDatagramDuplexStream",
    "WebTransportError",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "WebTransportCloseInfo",
] }
